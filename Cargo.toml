[workspace]
default-members = ["src/rentmap"]
members = ["src/api", "src/rentmap", "src/ui", "src/web"]
resolver = "2"

[workspace.dependencies]
dioxus = { version = "0.6.3" }

api = { path = "src/api" }
ui = { path = "src/ui" }

[profile.release]
lto = true
opt-level = "z"
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
