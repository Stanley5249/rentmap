[workspace]
default-members = ["src/rentmap"]
members = ["src/app", "src/frontend", "src/rentmap"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
leptos = "0.8.6"
leptos_axum = "0.8.5"

[profile.release]
lto = true
opt-level = "z"
strip = true

# https://github.com/leptos-rs/cargo-leptos
[[workspace.metadata.leptos]]
bin-package = "rentmap"
lib-package = "frontend"
name = "rentmap-web"
