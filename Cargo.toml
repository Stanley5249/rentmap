[workspace]
default-members = ["src/rentmap"]
members = ["src/rentmap", "src/rentmap-app", "src/rentmap-wasm"]
resolver = "2"

[workspace.dependencies]
dioxus = "0.6.3"
serde = "1.0.219"

rentmap = { path = "src/rentmap" }
rentmap-app = { path = "src/rentmap-app" }
rentmap-wasm = { path = "src/rentmap-wasm" }

[profile.release]
lto = true
opt-level = "z"
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
